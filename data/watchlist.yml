# SGC Swing Trader — watchlist
#
# Single source of truth for ticker universe and per-user holding state.
# Mutated via conversational Claude Code sessions per CLAUDE.md
# "Position management — two-user protocol". Manual edits possible as a
# fallback for emergencies.
#
# Schema (see docs/V1_SPEC.md §3 for full spec):
#   TICKER:
#     tier: A | B | C        # A mega-cap mature, B mid-to-large growth, C small-cap fat-tailed
#     notes: "free text"     # shared commentary
#     holders:
#       aidy:                # holder absent → user not tracking this ticker
#         state: watching    # or "entered"
#         # entry/target/stop/entered_date only present when state == entered
#       jesse:
#         state: watching
#
# Tier criteria (investor-grade, set 2026-05-20 for production v1):
#   A — Mega-cap (>$100B), mature, deep liquidity, defensive characteristics
#   B — $10-100B, established business, moderate vol, decade+ history
#   C — <$10B OR pre-revenue OR pure-narrative OR post-SPAC w/ <5y history
#
# Universe seeded 2026-05-20 with 21 tickers spanning A/B/C balance:
#   2 A · 9 B · 10 C — bias toward C reflects deliberate exposure to
#   narrative-driven asymmetric setups.

