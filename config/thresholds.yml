# SGC Swing Trader — calibratable thresholds
#
# Every numeric threshold the engine uses lives here. Code reads these via
# src.config; nothing else is allowed to hard-code a threshold value. To
# tune the system you edit this file and commit — no code changes needed.
#
# Plain-English notes on what each section controls live alongside the
# values. If you change a value, write a one-liner in the commit message
# explaining WHY (the audit trail matters as much as the change itself).

# ---------- Engine-level ----------

engine:
  # Years of history to pull from FMP per ticker.
  history_years: 5
  # HTTP timeout for FMP requests, seconds.
  fetch_timeout_sec: 30
  # Number of simulated price paths per (ticker, horizon) for Monte Carlo.
  mc_paths: 50000

# Two horizons analyzed in parallel every run. The dashboard shows both;
# verdicts that agree across horizons are stronger than horizon-specific.
horizons:
  primary_days: 30
  secondary_days: 60

# ---------- Step 1 — Data fetch & sanity ----------

data_sanity:
  # HARD FAIL: last bar is older than this many trading days.
  # Running on a frozen tape is worse than not running.
  freshness_hard_fail_days: 5
  # HARD FAIL: missing bars exceed this fraction of expected trading days.
  completeness_hard_fail_ratio: 0.05
  # WARN: any single-day return larger than this is flagged for human
  # review (real catastrophe OR unadjusted corporate action OR data
  # corruption — engine doesn't auto-decide).
  split_div_warn_return: 0.30
  # WARN: zero-volume bars exceed this fraction of the window.
  volume_warn_ratio: 0.05
  # Price-data cache TTL (hours). 4 hours is calibrated for Jesse's
  # manual + occasional intraday re-run pattern:
  #   - Multiple rapid iterations within ~4h hit cache (fast, no FMP
  #     quota burn while you're tweaking the dashboard or checking
  #     a verdict).
  #   - Run again later the same day (e.g. price moved a lot midday,
  #     re-evaluate): cache > 4h old -> fresh fetch automatically.
  #   - Overnight rollover (morning run after evening run): always
  #     fresh.
  #
  # Pass --refresh on the CLI to force a fresh fetch regardless of
  # cache age (e.g. you saw a major news event seconds ago and want
  # the latest tick).
  cache_ttl_hours: 4

# ---------- Step 3 — Catalyst detection ----------
#
# Lookback / forward windows for the FMP catalyst sub-fetches. Cache
# TTL controls how often the catalyst step re-hits FMP; news flow moves
# intraday but for a nightly engine 6 hours is more than fresh enough.
# The downstream Layer-3 catalyst veto and proximity haircut bands are
# in the conviction section below.

catalyst:
  # How many trading days forward to look for the next scheduled
  # catalyst (earnings, ex-div). 90 covers the secondary 60-day horizon
  # plus ~30 days of buffer for in-horizon-veto edge cases.
  forward_window_days: 90
  # How many days of historical earnings reactions to display in the
  # catalyst panel. 4 quarters = ~1 year of earnings history.
  history_lookback_quarters: 4
  # How many days back to look for news headlines and analyst
  # rating-change activity. 30 days = ~1 trading month, captures
  # the lead-up to the next event without burying signal in noise.
  news_lookback_days: 30
  analyst_lookback_days: 30
  # Per-ticker catalyst-step disk cache TTL (hours). News flow is more
  # dynamic than short-interest data so this is shorter than the
  # 24h short-interest cache, but still long enough that a same-day
  # re-run of `python -m src.main` doesn't re-hit FMP for every ticker.
  cache_ttl_hours: 6

# ---------- §4.2 Measurement-driven tier classifier ----------
#
# Each ticker scored against four observable properties. Worst-of rule:
# any property scoring C drags the measured tier to C.

tier_classifier:
  vol_window_days: 90
  vol_of_vol_inner_window: 20
  adv_window_days: 20
  # Upper bounds — value ≤ bound goes into that tier. .inf = catch-all.
  vol_annualized_bounds:
    A: 0.35
    B: 0.65
    C: .inf
  vol_of_vol_bounds:
    A: 0.15
    B: 0.30
    C: .inf
  # ADV bounds reversed (higher = better, so A needs the highest ADV).
  # Interpretation: ADV ≥ bound qualifies for that tier.
  # PyYAML scientific notation needs an explicit sign: 5.0e+8 = 500,000,000.
  adv_usd_lower_bounds:
    A: 5.0e+8
    B: 5.0e+7
    C: 0.0
  history_days_lower_bounds:
    A: 750
    B: 250
    C: 0

# ---------- §5.1 Conviction engine ----------
#
# Three-layer model:
#   Layer 1 — EDGE: does the math say yes? (P(target)-P(stop) + EV)
#   Layer 2 — CONFIDENCE: should we trust the math? (multiplier on edge)
#   Layer 3 — VETOES: specific reasons to back off (label override)
#
# Final conviction = edge_score × confidence_multiplier
# Verdict label = derived from final conviction, modified by any Layer 3
# veto that fires (vetoes change the label, not the number).

conviction:

  # Layer 1 — edge.
  edge:
    # Lottery filter: trade is a "lottery" only when BOTH P(target) -
    # P(stop) is at-or-below this threshold AND EV (units of risk) is
    # non-positive. The AND condition matters - our vol-scaled targets
    # (1 sigma reward / 0.7 sigma risk) structurally produce
    # P(target) < P(stop) by design (stop is closer to current), but
    # the asymmetric distance gives POSITIVE EV when drift cooperates.
    # Earlier behavior (block on prob_diff alone) made every watching
    # default a SKIP; the EV-aware version keeps the original intent
    # (block low-prob × huge-payoff lotteries with negative EV) while
    # letting genuine swing setups through. Modify both fields when
    # tuning: threshold for "how poor probability has to be" + the
    # EV check (in conviction.py) for "AND only when expectation is
    # also bad."
    lottery_filter_min_prob_diff: 0.0
    # Past the lottery filter: ev-weighted with a token probability term.
    # Swing trading is asymmetric-payoff-by-construction, so lean EV.
    ev_weight: 0.70
    probability_weight: 0.30
    # EV is normalized as "expected return / stop distance" (units of
    # risk). Cap at this multiplier so extreme asymmetry (which usually
    # signals model error) doesn't dominate the score.
    ev_cap_units_of_risk: 3.0

  # Layer 2 — confidence haircuts. Multiplicative: each haircut reduces
  # the confidence multiplier by its fraction. (1 - 0.30) × (1 - 0.10) ×
  # (1 - 0.20) = 0.504 worst case. Confidence multiplier can never
  # exceed 1.0 (full trust is the baseline, not bonus).
  haircuts:
    # MC ↔ PDE disagreement — graduated. Two methods (random simulation,
    # deterministic PDE) computing the same quantity should agree.
    # Disagreement = at least one method being stretched by unusual
    # conditions. Don't know which, so haircut both.
    mc_pde_disagreement:
      low_band:   {min_pp_delta: 5.0,  max_pp_delta: 10.0,    haircut: 0.30}
      high_band:  {min_pp_delta: 10.0, max_pp_delta: .inf,    haircut: 0.50}
    # Trajectory instability — verdict flip-flopping across recent
    # snapshots is itself evidence the signal is noisy.
    trajectory_instability:
      lookback_nights: 5
      min_direction_changes: 3
      haircut: 0.10
    # Tier mismatch — sustained §4.2 watchlist-vs-measured disagreement
    # means the pipeline ran the wrong priors for the current behavior.
    tier_mismatch:
      min_consecutive_nights_of_disagreement: 5
      haircut: 0.20

  # Layer 3 — vetoes. Change the verdict LABEL based on conditions,
  # independent of the conviction score number.
  vetoes:
    # The score above which ENTER is the default label (assuming no
    # veto). Below: WAIT (close to threshold) or SKIP (far below).
    #
    # Calibration: with ev_weight=0.70 and ev_cap_units_of_risk=3.0,
    # realistic swing-trade edges land in the 0.10-0.35 band. A "strong"
    # setup (P(target)=40%, P(stop)=30%, EV_norm=+0.30 = +3% EV vs 10%
    # stop) produces edge ~0.24. A "lock-in" setup (P(target)=70%,
    # P(stop)=20%, EV_norm=+1.5) produces edge ~0.55. Setting the
    # threshold at 0.30 means ENTER fires on genuinely above-average
    # setups, not marginal ones. The previous threshold (0.70) was
    # unreachable by any realistic 30d trade and made every output
    # a SKIP regardless of EV - effectively breaking the engine.
    enter_score_threshold: 0.30
    # Hysteresis band below threshold - between this and the threshold
    # the verdict is WAIT; below this it's SKIP.
    wait_score_floor: 0.10

    # Catalyst proximity (Layer 2 haircut + Layer 3 ENTER veto).
    # The two effects address different problems:
    #   - haircut: math becomes unreliable near binary events (3-5×
    #     normal vol on event day, bimodal return distribution)
    #   - in-horizon veto: don't take a NEW trade that goes through a
    #     known binary event — wait, see how the stock reacts, enter
    #     with more information
    catalyst:
      # Distance in trading sessions → confidence haircut.
      # Bands are evaluated in order; first match wins.
      proximity_haircut_bands:
        - {max_sessions: 1, haircut: 0.40}
        - {max_sessions: 3, haircut: 0.20}
        - {max_sessions: 5, haircut: 0.10}
      # In-horizon veto: ENTER → WAIT if catalyst falls inside the
      # horizon and user is in 'watching' state. 30d and 60d evaluated
      # independently. HOLD never gets a catalyst veto.
      in_horizon_veto:
        enabled: true

    # Regime override. Regime probability already feeds MC drift (Layer
    # 1 contribution), but persistent downtrend/crisis regimes
    # systematically beat MC's mean-reverting volatility model — so an
    # additional Layer-3 ENTER veto catches what the math underestimates.
    regime:
      # Names match the §2 step-2 regime detector states.
      enter_veto_regimes: [downtrend, crisis]
      # Below this confidence the regime call isn't firm enough — drift
      # modulation alone is sufficient.
      enter_veto_min_confidence: 0.70
      # Regime FLIP from positive → negative on an entered position
      # triggers TRIM (Layer 3 for HOLD-mode users).
      trim_on_flip_for_entered: true

    # Fair value extremes.
    fair_value:
      # Price ≥ FV mean + N × σ → SKIP for watching (greater-fool risk).
      enter_skip_premium_sigmas: 2.0
      # Same trigger for entered → TRIM (take profit at the extreme).
      trim_for_entered_premium_sigmas: 2.0

    # Liquidity veto — Tier C only. Below this ADV, SKIP regardless of
    # edge. This is the §4 catalyst-override "bare-minimum guard."
    liquidity_tier_c_only:
      min_adv_usd: 5.0e+6   # $5M average daily dollar volume floor

# ---------- Step 2 — Regime detector ----------

regime:
  # Five regime states, names chosen for narrative consistency with the
  # v17 dip engine. Plain-English meanings:
  #   uptrend_quiet  — price trending up, normal day-to-day moves
  #   uptrend_noisy  — trending up but with elevated daily swings
  #   downtrend      — sustained downward trend
  #   sideways       — range-bound, no clear direction
  #   crisis         — extreme volatility, breakdown of normal regime structure
  states: [uptrend_quiet, uptrend_noisy, downtrend, sideways, crisis]
  # Daily drift assumption (annualized return) per regime — fed into MC.
  # Calibrated to long-run averages; positive in uptrends, negative in
  # downtrends, near zero in sideways/crisis.
  drift_per_regime:
    uptrend_quiet:  0.15
    uptrend_noisy:  0.18
    downtrend:     -0.20
    sideways:       0.05
    crisis:         0.00

  # ---- Classifier configuration (used by src/pipeline/regime.py) ----
  #
  # The regime detector is a feature-centroid + softmax classifier, NOT
  # a Hidden Markov Model. Three observable features are computed from
  # daily log-returns over `feature_window_days`:
  #   1. trend_annualized   — slope of log-price vs day index, annualized
  #   2. vol_annualized     — stdev of daily log-returns × sqrt(252)
  #   3. vol_of_vol         — stdev of rolling-`vol_of_vol_inner_window`-day
  #                            vol across the feature window, annualized
  # Each state has a centroid in this 3-D feature space (below). The
  # detector scores the observed features against every centroid by
  # normalized Euclidean distance, applies softmax (with `softmax_
  # temperature` controlling decisiveness) to get probabilities, and
  # picks argmax. Confidence is the winning probability.
  #
  # Why this approach over an HMM: explainable, deterministic, no exotic
  # dependencies, calibratable here without code changes. See module
  # docstring in src/pipeline/regime.py for the full rationale.

  # Window for the primary feature computation (trend slope + vol).
  feature_window_days: 60
  # Inner window for vol-of-vol — rolling-vol window that's then
  # itself rolled across feature_window_days. 20 = roughly one trading
  # month, captures structural vol shifts without intraday noise.
  vol_of_vol_inner_window: 20
  # Lookback for the days_in_regime computation — walks backward,
  # re-classifying each day to find the most recent flip into the
  # current state.
  days_in_regime_lookback: 60
  # Softmax temperature — lower = more decisive (sharper probabilities),
  # higher = smoother (less confident at boundaries). 0.5 makes a 2x
  # distance difference roughly translate to a 7:1 probability ratio,
  # which is decisive enough to fire the 70% confidence veto threshold
  # when the call is clean but stays below it at genuine boundaries.
  softmax_temperature: 0.5
  # Per-feature normalization scale — divides the (observed - centroid)
  # delta before computing distance, so each dimension contributes
  # roughly equally despite very different natural units. Calibrated so
  # a "centroid-to-centroid typical span" in each feature produces ~1.0
  # in normalized space:
  #   trend span uptrend(+0.15) → downtrend(-0.25) ≈ 0.40  → scale 0.40
  #   vol   span uptrend_quiet(0.20) → crisis(0.90) ≈ 0.70 → scale 0.70
  #   vov   span uptrend_quiet(0.05) → crisis(0.50) ≈ 0.45 → scale 0.45
  # Earlier scales (0.5/1.0/0.5) over-weighted trend so crisis cases
  # with steep decline got mis-classified as downtrend even when vol
  # and vol-of-vol both pointed to crisis. These scales restore balance.
  normalization_scale:
    trend_annualized: 0.40
    vol_annualized:   0.70
    vol_of_vol:       0.45

  # Feature centroids per state. The classifier assigns the state
  # whose centroid is nearest to the observed features. Tune these to
  # change regime sensitivity. Values are hand-calibrated to long-run
  # broad-market averages; each ticker is classified against the same
  # centroids (no per-ticker calibration in v1 — the tier classifier
  # already captures per-ticker character separately).
  centroids:
    uptrend_quiet:
      trend_annualized: 0.15    # +15% annual price slope
      vol_annualized:   0.20    # 20% annual vol (broad-market normal)
      vol_of_vol:       0.05    # very stable vol — predictable regime
    uptrend_noisy:
      trend_annualized: 0.15
      vol_annualized:   0.45    # elevated but not crisis vol
      vol_of_vol:       0.15
    downtrend:
      trend_annualized: -0.25   # sustained -25% annual decline
      vol_annualized:   0.40    # elevated (bear-market vol)
      vol_of_vol:       0.20
    sideways:
      trend_annualized: 0.00    # no directional drift
      vol_annualized:   0.25
      vol_of_vol:       0.08
    crisis:
      trend_annualized: -0.25   # crisis usually IS steeply negative; this
                                # is also the downtrend trend, so vol/vov
                                # have to do the work of distinguishing
      vol_annualized:   0.90    # 90% annual vol = chaos (March 2020 territory)
      vol_of_vol:       0.50    # unstable vol — vol itself is volatile

# ---------- Step 4 — Volatility forecast (GARCH(1,1)) ----------
#
# Standard daily-data GARCH(1,1): sigma_squared_t = omega + alpha*r_squared_(t-1) + beta*sigma_squared_(t-1).
# We don't run MLE fitting (scipy.optimize not in our deps). Instead:
#   - alpha, beta are literature defaults for equity daily vol
#     (RiskMetrics-adjacent values used at most professional desks
#     before any tuning)
#   - sigma_LR squared (long-run variance) comes from the sample variance over
#     the long-run window — data-driven, ticker-specific
#   - omega is derived: omega = sigma_LR_squared * (1 - alpha - beta)
# So the model dynamics use literature parameters but the LEVELS are
# fully data-driven per ticker. Cleaner than MLE for v1 — no fragile
# numerical optimization, deterministic, explainable.

volatility:
  # Window for the "current realized vol" shown in the dashboard.
  # 60 trading days ~ 3 months — long enough to stabilize, short
  # enough to reflect recent regime. Matches the dashboard's
  # "60d trailing" description.
  current_window_days: 60
  # Window for the long-run variance estimate that GARCH mean-reverts
  # toward. 252 trading days = 1 calendar year. Captures one full
  # cycle of vol regimes without overweighting ancient history.
  long_run_window_days: 252
  # GARCH(1,1) persistence parameters — literature defaults for
  # daily equity vol. alpha + beta = 0.95 means each shock has
  # half-life of ~13.5 trading days (log(0.5)/log(0.95)).
  garch_alpha: 0.05      # innovation weight on r_squared_(t-1)
  garch_beta:  0.90      # persistence weight on sigma_squared_(t-1)
  # Confidence-band labels keyed by anchor tier. Tier-A names have
  # deeper price history + tighter sampling -> tighter forecast band.
  # Surfaced in the dashboard for plain-English interpretation only;
  # the actual MC variance fed downstream uses the point forecast.
  confidence_band_by_tier:
    A: tight
    B: moderate
    C: wide

# ---------- Targets (target/stop derivation for watching users) ----------
#
# For `entered` users we use the user-specified target/stop from
# watchlist.yml (set during the `bought` flow). For `watching` users
# we have to PROPOSE target/stop levels so MC can compute P(target),
# P(stop), EV — without them the system has no signal.
#
# Default approach: vol-scaled bands using the GARCH 30d vol forecast.
#   target = current * exp(+m * sigma * sqrt(horizon/252))
#   stop   = current * exp(-k * sigma * sqrt(horizon/252))
# with m > k for asymmetric reward:risk (the swing-trader's
# bread-and-butter — risk less than you stand to gain).
#
# Why vol-scaled and not round percentages: IONQ moves ~6%/day and
# NVDA moves ~2%/day. A round -5% stop is one bad IONQ day vs.
# multiple NVDA standard deviations. Vol-scaling makes the levels
# proportional to each ticker's actual character.

targets:
  # Multipliers in units of sigma (vol). Calibrated for SWING-TRADE
  # achievability over a 30-day horizon — not portfolio-level R/R
  # framing. Reasoning:
  #
  #   Target at +2 sigma over 30d for a 40%/yr vol stock = +32%, which
  #   only ~5% of paths would touch in 30 days (2-sigma events are
  #   rare by construction). Most paths end in "neither" territory ->
  #   no signal. Reasonable swing-trade targets sit at ~+1 sigma,
  #   where P(touched) ~40% and the trade actually has a real shot.
  #
  #   target=+1 sigma, stop=-0.7 sigma keeps the asymmetry (1.43:1
  #   reward:risk in distance terms) while making both levels hittable
  #   with meaningful probability. The asymmetric distance + drift
  #   tilt from regime is what produces positive EV in the conviction
  #   layer, not the centroid spread alone.
  target_sigma_multiplier: 1.0   # +1 sigma -> target
  stop_sigma_multiplier:   0.7   # -0.7 sigma -> stop
  # Horizon to use when scaling sigma -> price level. Using the
  # primary (30d) horizon means target/stop are stable across both
  # 30d and 60d MC sims — they don't widen further for the longer
  # horizon (which would make 60d P(target) artificially low).
  scaling_horizon_days: 30

# ---------- Step 6 — Monte Carlo simulation ----------

monte_carlo:
  # Seed strategy: derived from hash((ticker, run_date)) so same-day
  # re-runs are reproducible but different days/tickers are independent.
  # Documented here for discoverability; logic baked into module.
  seed_strategy: ticker_date_hash
  # Whether to overlay an empirical earnings-reaction jump on scheduled
  # earnings days that fall within the simulation horizon. On = the
  # GBM step for that day is REPLACED with a random draw from the
  # ticker's historical_reactions (from the catalyst step). Off = pure
  # GBM throughout. Keep on for production; off useful for ablation
  # studies ("how much does the jump overlay change P(stop)?").
  earnings_jump_overlay: true
  # Brownian bridge correction for first-passage probability. When ON
  # (default), MC's first-passage check accounts for the probability
  # that a path crossed a barrier INTRADAY between two daily closes
  # that didn't themselves cross. Eliminates the ~5pp systematic
  # underestimate of P(stop) we documented in the PDE cross-check.
  # When OFF, uses daily-close-only logic (the original, biased
  # behavior - useful for ablation: "did bridge correction actually
  # close the MC<->PDE gap?").
  brownian_bridge_correction: true
  # How many forward trading days to expose in the dashboard's
  # daily-path summary panel. Matches the 60d secondary horizon.
  daily_path_days: 60

# ---------- Step 5 — Fair value triangulation ----------
#
# Three independent valuation methods, triangulated by taking the
# median (robust to outliers) for `range_mean`. The range_low and
# range_high come from the actual min/max across methods; sigma is
# estimated as (high - low) / 4 for premium-vs-FV computation.
#
# Each method is independent — failures (negative FCF, missing
# analyst estimates, no peers, gated endpoints) skip that method but
# don't fail the step. The minimum_methods threshold sets how many
# must succeed for the step to return "ok" overall.

fair_value:
  # 1-of-3 is enough for v1 - even with just one method we get a
  # premium-vs-anchor signal. When more methods agree, the range
  # tightens and the signal is more decisive.
  min_methods_for_triangulation: 1

  # If only one method succeeds, we can't compute a real range/sigma.
  # Fall back to this fraction of the method's value as the +/-1 sigma
  # width (15% reflects typical valuation uncertainty for established
  # equities).
  single_method_sigma_pct: 0.15

  # Per-method disk cache TTL. Fundamental data (income, cash flow,
  # analyst estimates) changes quarterly to biweekly, not daily - 24h
  # is generous AND avoids re-hitting FMP for every nightly run.
  cache_ttl_hours: 24

  # DCF parameters
  dcf:
    enabled: true
    # Tier-aware discount rate (WACC / required return). Higher-risk
    # tiers demand a higher equity risk premium - the literature is
    # consistent on this. Bands:
    #   A: 8.5%  - mature mega-caps, broad analyst coverage, stable
    #              cash flows (NVDA-like). ~4% risk-free + ~4.5% ERP.
    #   B: 9.5%  - mid-cap growth, moderate idiosyncratic risk
    #              (AMAT-like cyclical semis). ~4% + ~5.5% ERP.
    #   C: 12.0% - small-cap, fat-tailed, often pre-profitability
    #              (IONQ-like quantum). ~4% + ~8% ERP for the size +
    #              business-model risk premium.
    # Earlier the single 9% rate produced a fair value that was too
    # generous for Tier C names (their cash flows deserve a steeper
    # discount given the wider distribution of outcomes) and too
    # punishing for Tier A (their flows are more predictable than the
    # 9% required-return implies).
    discount_rate_by_tier:
      A: 0.085
      B: 0.095
      C: 0.120
    # Default WACC when ticker has no tier label.
    discount_rate_default: 0.09
    # Backwards-compatible alias (read by _resolve_discount_rate as
    # fallback if discount_rate_by_tier missing).
    discount_rate: 0.09
    # Terminal growth rate (perpetuity post-projection). 2.5% =
    # roughly long-run GDP+inflation - the maximum reasonable
    # forever-growth rate.
    terminal_growth: 0.025
    # Years of explicit FCF projection before terminal value.
    projection_years: 5
    # Tier-aware growth cap. Mature mega-caps can't sustain 25%
    # growth for 5 years - the base-size constraint dominates (NVDA
    # at 25%/yr for 5 years reaches 3x its current $5T market cap,
    # larger than the entire S&P 500). Early-stage names CAN sustain
    # higher growth as they scale from a low base. Bands:
    #   A: 15% - mature mega-cap (great-year sustainable rate)
    #   B: 25% - mid-cap growth (achievable mid-cycle)
    #   C: 40% - small-cap catalyst (early-stage scaling band)
    growth_rate_cap_by_tier:
      A: 0.15
      B: 0.25
      C: 0.40
    # Default cap when ticker has no tier label.
    growth_rate_cap_default: 0.25
    # Growth estimator method:
    #   "cagr"       - compound annual growth rate from endpoints
    #                  over the FCF history window. Smooths single-
    #                  year cyclical dips (e.g. AMAT's chip-cycle
    #                  down-years would no longer project a -1.4%
    #                  perpetual decline that anchors DCF absurdly
    #                  low). Default.
    #   "median_yoy" - median of YoY growth rates. More sensitive to
    #                  recent year's data; the previous default.
    #                  Retained as the auto-fallback when any FCF
    #                  value is non-positive (geometric mean math
    #                  breaks otherwise).
    growth_estimator: cagr
    # If TTM FCF is negative, DCF is mathematically meaningless
    # (you'd be discounting losses forever). Skip the method and
    # let the others do the work.
    skip_when_fcf_negative: true

  # Forward P/E peer comparison
  forward_pe_peers:
    enabled: true
    # Cap peer count to manage FMP quota. Industry default is 5 peers
    # (FMP's stock-peers returns ~5-10).
    max_peers: 5

  # Analyst PT consensus method - uses the median price target from
  # price-target-consensus. Already fetched by the catalyst step;
  # this method just plugs it in as one of the three valuation
  # anchors. No additional config needed.
  analyst_pt:
    enabled: true

# ---------- Materiality (mirrors v17 dip engine) ----------

materiality:
  # Predicted dip must exceed this to count as "worth waiting for."
  dip_pct_threshold: 0.03
  # Predicted rally must exceed this to register as a meaningful rally target.
  rally_pct_threshold: 0.03

# ---------- Price levels (dip entry / rally sell zones) ----------
#
# These are the prominent, actionable numbers each ticker card shows up
# top: the price level at which the configured percentile of Monte Carlo
# paths touches on the way DOWN (= dip entry zone) or on the way UP
# (= rally sell zone), and the calendar window when that touch is most
# likely. Same concept the v17 dip engine surfaced under "BUY at $X
# (conviction 80%)" and "rally target $Y".

price_levels:
  # Fraction of simulated MC paths that touch the level. v17 used 70%
  # for both — we keep the parameter split so they can diverge later.
  dip_conviction_percentile: 0.70
  rally_conviction_percentile: 0.70
  # ±N trading sessions around the median date when the dip/rally is
  # most likely to occur. v17 used 7 (a 2-week window).
  date_range_half_width_sessions: 7

# ---------- Step 7 — MC ↔ PDE cross-check ----------

cross_check:
  # P(target) disagreement tolerance — within this many percentage
  # points, the two methods are "in agreement" (no haircut).
  p_target_agreement_tolerance_pp: 5.0
  # EV agreement tolerance as a fraction (5% relative).
  ev_agreement_tolerance_pct: 0.05

# ---------- Conviction trajectory (§7) ----------

trajectory:
  # Window for the rolling smoother that classifies trajectory as
  # rising / stable / decaying / flip-flopping.
  smoothing_window_nights: 5
  # Per-night slope (in score units) above which the trajectory is "rising".
  rising_threshold_slope: 0.01
  # Below this, "decaying".
  decaying_threshold_slope: -0.01

# ---------- Dashboard display ----------

dashboard:
  # Daily-path expandable: how many forward sessions to render.
  daily_path_session_count: 60
  # Conviction trajectory sparkline length.
  trajectory_sparkline_nights: 30
  # How many recent news headlines per ticker on the catalyst panel.
  news_headlines_max: 3
  # How many past earnings reactions to display.
  earnings_reactions_lookback: 4

# ---------- Claude API pricing (for run-cost tracking) ----------
#
# Per-million-token prices in USD. Used to convert tokens-consumed
# (tracked per run inside the engine) into a per-run dollar cost shown
# in the dashboard header — plus an estimated annualized figure
# (cost-per-run × runs-per-year).
#
# Update these when Anthropic changes pricing. Sources:
#   https://www.anthropic.com/pricing
# Defaults are the published 2026 prices for Claude Sonnet 4.6 — the
# expected workhorse model for thesis + engine-read generation.

claude_pricing:
  model_name: "claude-sonnet-4-6"
  input_per_million_tokens_usd:  3.00
  output_per_million_tokens_usd: 15.00
  # How often the engine runs per year (nightly cron = 365).
  runs_per_year: 365
